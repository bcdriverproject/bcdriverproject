<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BC DRIVER - Controle Financeiro</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [metaMensal, setMetaMensal] = useState(16000);
            const [ganhos, setGanhos] = useState([]);
            const [gastos, setGastos] = useState([]);
            const [dividas, setDividas] = useState([]);
            const [horas, setHoras] = useState([]);

            // Carregar dados do localStorage
            useEffect(() => {
                const savedGanhos = localStorage.getItem('ganhos');
                const savedGastos = localStorage.getItem('gastos');
                const savedDividas = localStorage.getItem('dividas');
                const savedHoras = localStorage.getItem('horas');
                const savedMeta = localStorage.getItem('metaMensal');

                if (savedGanhos) setGanhos(JSON.parse(savedGanhos));
                if (savedGastos) setGastos(JSON.parse(savedGastos));
                if (savedDividas) setDividas(JSON.parse(savedDividas));
                if (savedHoras) setHoras(JSON.parse(savedHoras));
                if (savedMeta) setMetaMensal(parseFloat(savedMeta));
            }, []);

            // Salvar dados no localStorage
            useEffect(() => {
                localStorage.setItem('ganhos', JSON.stringify(ganhos));
            }, [ganhos]);

            useEffect(() => {
                localStorage.setItem('gastos', JSON.stringify(gastos));
            }, [gastos]);

            useEffect(() => {
                localStorage.setItem('dividas', JSON.stringify(dividas));
            }, [dividas]);

            useEffect(() => {
                localStorage.setItem('horas', JSON.stringify(horas));
            }, [horas]);

            useEffect(() => {
                localStorage.setItem('metaMensal', metaMensal.toString());
            }, [metaMensal]);

            // Funções de cálculo
            const getMesAtual = () => {
                const now = new Date();
                return { mes: now.getMonth(), ano: now.getFullYear() };
            };

            const filtrarPorMes = (lista) => {
                const { mes, ano } = getMesAtual();
                return lista.filter(item => {
                    const data = new Date(item.data);
                    return data.getMonth() === mes && data.getFullYear() === ano;
                });
            };

            const ganhosMes = filtrarPorMes(ganhos).reduce((sum, g) => sum + g.valor, 0);
            const gastosMes = filtrarPorMes(gastos).reduce((sum, g) => sum + g.valor, 0);
            const horasMes = filtrarPorMes(horas).reduce((sum, h) => sum + h.horas, 0);
            const dividasMes = dividas.filter(d => d.ativa).reduce((sum, d) => sum + d.valorParcela, 0);
            const lucroRealMes = ganhosMes - gastosMes - dividasMes;
            const lucroPorHoraMes = horasMes > 0 ? lucroRealMes / horasMes : 0;
            const progressoMeta = (ganhosMes / metaMensal) * 100;
            const faltaParaMeta = metaMensal - ganhosMes;

            // Dados de hoje
            const hoje = new Date().toISOString().split('T')[0];
            const ganhosHoje = ganhos.filter(g => g.data === hoje).reduce((sum, g) => sum + g.valor, 0);
            const gastosHoje = gastos.filter(g => g.data === hoje).reduce((sum, g) => sum + g.valor, 0);
            const horasHoje = horas.filter(h => h.data === hoje).reduce((sum, h) => sum + h.horas, 0);
            const lucroHoje = ganhosHoje - gastosHoje;
            const lucroPorHoraHoje = horasHoje > 0 ? lucroHoje / horasHoje : 0;

            // Mensagens inteligentes
            const getMensagemValeAPena = () => {
                const l = lucroPorHoraHoje;
                const hora = new Date().getHours();
                const pico = (hora >= 6 && hora <= 10) || (hora >= 17 && hora <= 22);

                if (l >= 80) return '🔥 DIA EXCEPCIONAL! Continue rodando.';
                if (l >= 60) return '💎 Excelente, você está no seu padrão. Vale continuar.';
                if (l >= 45 && pico) return '⚡ Horário de pico executivo, pode valer a pena continuar.';
                if (l >= 45) return '⚠️ Lucro abaixo do seu padrão. Avalie se vale continuar.';
                return '🛑 Lucro muito baixo. Melhor parar e voltar em horário premium.';
            };

            const getMensagemLucroPorHora = () => {
                const l = lucroPorHoraMes;
                if (l >= 80) return '🔥 Lucro por hora EXCEPCIONAL!';
                if (l >= 60) return '💎 Lucro por hora EXCELENTE (dentro do seu padrão).';
                if (l >= 45) return '⚠️ Lucro por hora abaixo do seu padrão.';
                return '🚨 Lucro por hora crítico. Algo está errado na estratégia.';
            };

            const getMensagemMeta = () => {
                const p = progressoMeta;
                if (p >= 100) return '🎉 Parabéns! Meta mensal batida.';
                if (p >= 80) return '🎯 Você está quase batendo a meta.';
                if (p >= 50) return '✅ Você está no ritmo certo.';
                return '⚡ Está abaixo do ritmo, é hora de acelerar.';
            };

            const getMensagemEquilibrio = () => {
                if (ganhosMes === 0) return 'Sem dados suficientes neste mês.';
                const perc = (lucroRealMes / ganhosMes) * 100;
                if (perc >= 60) return '🔥 Gestão excepcional, lucro muito alto.';
                if (perc >= 40) return '💎 Lucro saudável, você está bem.';
                if (perc >= 20) return '⚠️ Lucro baixo, dá para melhorar.';
                if (perc > 0) return '🚨 Situação crítica, pouco lucro.';
                return '⛔ Prejuízo, você está só pagando contas.';
            };

            // Componentes de cada aba
            const Dashboard = () => (
                <div className="p-4 space-y-4">
                    <div className="bg-gradient-to-r from-purple-600 to-blue-600 text-white p-6 rounded-lg">
                        <h1 className="text-2xl font-bold">BC DRIVER</h1>
                        <p className="text-sm opacity-90">Controle Financeiro Premium</p>
                    </div>

                    <div className="bg-white p-4 rounded-lg shadow">
                        <h3 className="font-bold mb-2">Vale a pena continuar rodando hoje?</h3>
                        <p className="text-sm">{getMensagemValeAPena()}</p>
                        <p className="text-xs text-gray-600 mt-2">Lucro/hora hoje: R$ {lucroPorHoraHoje.toFixed(2)}</p>
                    </div>

                    <div className="bg-white p-4 rounded-lg shadow">
                        <h3 className="font-bold mb-2">Quanto falta para bater a meta mensal?</h3>
                        <p className="text-sm">{getMensagemMeta()}</p>
                        <p className="text-xs text-gray-600 mt-2">Faltam: R$ {faltaParaMeta.toFixed(2)}</p>
                        <div className="w-full bg-gray-200 rounded-full h-2 mt-2">
                            <div className="bg-purple-600 h-2 rounded-full" style={{width: `${Math.min(progressoMeta, 100)}%`}}></div>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-lg shadow">
                        <h3 className="font-bold mb-2">Qual é meu lucro por hora?</h3>
                        <p className="text-sm">{getMensagemLucroPorHora()}</p>
                        <p className="text-xs text-gray-600 mt-2">Lucro/hora mês: R$ {lucroPorHoraMes.toFixed(2)}</p>
                    </div>

                    <div className="bg-white p-4 rounded-lg shadow">
                        <h3 className="font-bold mb-2">Estou pagando dívidas ou já estou no lucro?</h3>
                        <p className="text-sm">{getMensagemEquilibrio()}</p>
                        <p className="text-xs text-gray-600 mt-2">Lucro real mês: R$ {lucroRealMes.toFixed(2)}</p>
                    </div>

                    <div className="bg-white p-4 rounded-lg shadow">
                        <h3 className="font-bold mb-3">Resumo do Mês</h3>
                        <div className="space-y-2 text-sm">
                            <div className="flex justify-between">
                                <span>Ganhos:</span>
                                <span className="font-bold text-green-600">R$ {ganhosMes.toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between">
                                <span>Gastos:</span>
                                <span className="font-bold text-red-600">R$ {gastosMes.toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between">
                                <span>Dívidas:</span>
                                <span className="font-bold text-orange-600">R$ {dividasMes.toFixed(2)}</span>
                            </div>
                            <div className="border-t pt-2 flex justify-between">
                                <span>Lucro Real:</span>
                                <span className={`font-bold ${lucroRealMes >= 0 ? 'text-purple-600' : 'text-red-600'}`}>
                                    R$ {lucroRealMes.toFixed(2)}
                                </span>
                            </div>
                            <div className="text-xs text-gray-600 mt-2">
                                Horas trabalhadas: {horasMes.toFixed(1)}h
                            </div>
                        </div>
                    </div>
                </div>
            );

            const Ganhos = () => {
                const [tipo, setTipo] = useState('uber');
                const [valor, setValor] = useState('');
                const [data, setData] = useState(hoje);
                const [obs, setObs] = useState('');

                const adicionar = () => {
                    if (!valor) return;
                    setGanhos([...ganhos, {
                        id: Date.now().toString(),
                        tipo,
                        valor: parseFloat(valor),
                        data,
                        observacao: obs
                    }]);
                    setValor('');
                    setObs('');
                };

                return (
                    <div className="p-4 space-y-4">
                        <h2 className="text-xl font-bold">Lançar Ganho</h2>
                        <div className="bg-white p-4 rounded-lg shadow space-y-3">
                            <div>
                                <label className="block text-sm font-medium mb-1">Tipo</label>
                                <select value={tipo} onChange={(e) => setTipo(e.target.value)} className="w-full p-2 border rounded">
                                    <option value="uber">Uber</option>
                                    <option value="99">99</option>
                                    <option value="particular">Particular</option>
                                    <option value="black">Black</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Valor (R$)</label>
                                <input type="number" value={valor} onChange={(e) => setValor(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Data</label>
                                <input type="date" value={data} onChange={(e) => setData(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Observação</label>
                                <input type="text" value={obs} onChange={(e) => setObs(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <button onClick={adicionar} className="w-full bg-green-600 text-white p-2 rounded font-medium">
                                Adicionar Ganho
                            </button>
                        </div>

                        <h3 className="font-bold mt-6">Ganhos do Mês</h3>
                        <div className="space-y-2">
                            {filtrarPorMes(ganhos).map(g => (
                                <div key={g.id} className="bg-white p-3 rounded shadow flex justify-between items-center">
                                    <div>
                                        <p className="font-medium">{g.tipo}</p>
                                        <p className="text-xs text-gray-600">{new Date(g.data).toLocaleDateString('pt-BR')}</p>
                                        {g.observacao && <p className="text-xs text-gray-500">{g.observacao}</p>}
                                    </div>
                                    <p className="font-bold text-green-600">R$ {g.valor.toFixed(2)}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const Gastos = () => {
                const [categoria, setCategoria] = useState('combustivel');
                const [valor, setValor] = useState('');
                const [data, setData] = useState(hoje);
                const [obs, setObs] = useState('');

                const adicionar = () => {
                    if (!valor) return;
                    setGastos([...gastos, {
                        id: Date.now().toString(),
                        categoria,
                        valor: parseFloat(valor),
                        data,
                        observacao: obs
                    }]);
                    setValor('');
                    setObs('');
                };

                return (
                    <div className="p-4 space-y-4">
                        <h2 className="text-xl font-bold">Lançar Gasto</h2>
                        <div className="bg-white p-4 rounded-lg shadow space-y-3">
                            <div>
                                <label className="block text-sm font-medium mb-1">Categoria</label>
                                <select value={categoria} onChange={(e) => setCategoria(e.target.value)} className="w-full p-2 border rounded">
                                    <option value="combustivel">Combustível/Energia</option>
                                    <option value="internet">Internet</option>
                                    <option value="lavagem">Lavagem</option>
                                    <option value="alimentacao">Alimentação</option>
                                    <option value="manutencao">Manutenção</option>
                                    <option value="equipamentos">Equipamentos</option>
                                    <option value="outros">Outros</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Valor (R$)</label>
                                <input type="number" value={valor} onChange={(e) => setValor(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Data</label>
                                <input type="date" value={data} onChange={(e) => setData(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Observação</label>
                                <input type="text" value={obs} onChange={(e) => setObs(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <button onClick={adicionar} className="w-full bg-red-600 text-white p-2 rounded font-medium">
                                Adicionar Gasto
                            </button>
                        </div>

                        <h3 className="font-bold mt-6">Gastos do Mês</h3>
                        <div className="space-y-2">
                            {filtrarPorMes(gastos).map(g => (
                                <div key={g.id} className="bg-white p-3 rounded shadow flex justify-between items-center">
                                    <div>
                                        <p className="font-medium">{g.categoria}</p>
                                        <p className="text-xs text-gray-600">{new Date(g.data).toLocaleDateString('pt-BR')}</p>
                                        {g.observacao && <p className="text-xs text-gray-500">{g.observacao}</p>}
                                    </div>
                                    <p className="font-bold text-red-600">R$ {g.valor.toFixed(2)}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const Dividas = () => {
                const [nome, setNome] = useState('');
                const [valorParcela, setValorParcela] = useState('');
                const [totalParcelas, setTotalParcelas] = useState('');

                const adicionar = () => {
                    if (!nome || !valorParcela || !totalParcelas) return;
                    setDividas([...dividas, {
                        id: Date.now().toString(),
                        nome,
                        valorParcela: parseFloat(valorParcela),
                        totalParcelas: parseInt(totalParcelas),
                        parcelasPagas: 0,
                        valorTotal: parseFloat(valorParcela) * parseInt(totalParcelas),
                        ativa: true
                    }]);
                    setNome('');
                    setValorParcela('');
                    setTotalParcelas('');
                };

                return (
                    <div className="p-4 space-y-4">
                        <h2 className="text-xl font-bold">Gerenciar Dívidas</h2>
                        <div className="bg-white p-4 rounded-lg shadow space-y-3">
                            <div>
                                <label className="block text-sm font-medium mb-1">Nome da Dívida</label>
                                <input type="text" value={nome} onChange={(e) => setNome(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Valor da Parcela (R$)</label>
                                <input type="number" value={valorParcela} onChange={(e) => setValorParcela(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Total de Parcelas</label>
                                <input type="number" value={totalParcelas} onChange={(e) => setTotalParcelas(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <button onClick={adicionar} className="w-full bg-orange-600 text-white p-2 rounded font-medium">
                                Adicionar Dívida
                            </button>
                        </div>

                        <h3 className="font-bold mt-6">Dívidas Ativas</h3>
                        <div className="space-y-2">
                            {dividas.filter(d => d.ativa).map(d => (
                                <div key={d.id} className="bg-white p-3 rounded shadow">
                                    <div className="flex justify-between items-start mb-2">
                                        <p className="font-medium">{d.nome}</p>
                                        <p className="font-bold text-orange-600">R$ {d.valorParcela.toFixed(2)}/mês</p>
                                    </div>
                                    <p className="text-xs text-gray-600">
                                        {d.parcelasPagas}/{d.totalParcelas} parcelas pagas
                                    </p>
                                    <div className="w-full bg-gray-200 rounded-full h-2 mt-2">
                                        <div className="bg-orange-600 h-2 rounded-full" 
                                             style={{width: `${(d.parcelasPagas / d.totalParcelas) * 100}%`}}>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const Horas = () => {
                const [horasInput, setHorasInput] = useState('');
                const [data, setData] = useState(hoje);
                const [obs, setObs] = useState('');

                const adicionar = () => {
                    if (!horasInput) return;
                    setHoras([...horas, {
                        id: Date.now().toString(),
                        horas: parseFloat(horasInput),
                        data,
                        observacao: obs
                    }]);
                    setHorasInput('');
                    setObs('');
                };

                return (
                    <div className="p-4 space-y-4">
                        <h2 className="text-xl font-bold">Registrar Horas</h2>
                        <div className="bg-white p-4 rounded-lg shadow space-y-3">
                            <div>
                                <label className="block text-sm font-medium mb-1">Horas Trabalhadas</label>
                                <input type="number" step="0.5" value={horasInput} onChange={(e) => setHorasInput(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Data</label>
                                <input type="date" value={data} onChange={(e) => setData(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Observação</label>
                                <input type="text" value={obs} onChange={(e) => setObs(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <button onClick={adicionar} className="w-full bg-blue-600 text-white p-2 rounded font-medium">
                                Registrar Horas
                            </button>
                        </div>

                        <h3 className="font-bold mt-6">Horas do Mês</h3>
                        <div className="space-y-2">
                            {filtrarPorMes(horas).map(h => (
                                <div key={h.id} className="bg-white p-3 rounded shadow flex justify-between items-center">
                                    <div>
                                        <p className="text-xs text-gray-600">{new Date(h.data).toLocaleDateString('pt-BR')}</p>
                                        {h.observacao && <p className="text-xs text-gray-500">{h.observacao}</p>}
                                    </div>
                                    <p className="font-bold text-blue-600">{h.horas}h</p>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const Config = () => {
                const [metaInput, setMetaInput] = useState(metaMensal.toString());

                const salvarMeta = () => {
                    setMetaMensal(parseFloat(metaInput));
                };

                const exportarDados = () => {
                    const dados = {
                        ganhos,
                        gastos,
                        dividas,
                        horas,
                        metaMensal
                    };
                    const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'bc-driver-backup.json';
                    a.click();
                };

                const limparDados = () => {
                    if (confirm('Tem certeza que deseja limpar TODOS os dados?')) {
                        setGanhos([]);
                        setGastos([]);
                        setDividas([]);
                        setHoras([]);
                        localStorage.clear();
                    }
                };

                return (
                    <div className="p-4 space-y-4">
                        <h2 className="text-xl font-bold">Configurações</h2>

                        <div className="bg-white p-4 rounded-lg shadow space-y-3">
                            <h3 className="font-medium">Meta Mensal</h3>
                            <div>
                                <label className="block text-sm font-medium mb-1">Valor da Meta (R$)</label>
                                <input type="number" value={metaInput} onChange={(e) => setMetaInput(e.target.value)} className="w-full p-2 border rounded" />
                            </div>
                            <button onClick={salvarMeta} className="w-full bg-purple-600 text-white p-2 rounded font-medium">
                                Salvar Meta
                            </button>
                        </div>

                        <div className="bg-white p-4 rounded-lg shadow space-y-3">
                            <h3 className="font-medium">Backup e Dados</h3>
                            <button onClick={exportarDados} className="w-full bg-blue-600 text-white p-2 rounded font-medium">
                                Exportar Dados (Backup)
                            </button>
                            <button onClick={limparDados} className="w-full bg-red-600 text-white p-2 rounded font-medium">
                                Limpar Todos os Dados
                            </button>
                        </div>

                        <div className="bg-white p-4 rounded-lg shadow">
                            <h3 className="font-medium mb-2">Sobre</h3>
                            <p className="text-sm text-gray-600">BC DRIVER - Controle Financeiro Premium</p>
                            <p className="text-xs text-gray-500 mt-2">Versão 1.0</p>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-100">
                    <div className="max-w-md mx-auto bg-white min-h-screen">
                        {activeTab === 'dashboard' && <Dashboard />}
                        {activeTab === 'ganhos' && <Ganhos />}
                        {activeTab === 'gastos' && <Gastos />}
                        {activeTab === 'dividas' && <Dividas />}
                        {activeTab === 'horas' && <Horas />}
                        {activeTab === 'config' && <Config />}

                        <div className="fixed bottom-0 left-0 right-0 bg-white border-t max-w-md mx-auto">
                            <div className="flex justify-around p-2">
                                <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center p-2 ${activeTab === 'dashboard' ? 'text-purple-600' : 'text-gray-600'}`}>
                                    <span className="text-xl">📊</span>
                                    <span className="text-xs">Dashboard</span>
                                </button>
